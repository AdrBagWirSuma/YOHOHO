<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>I'm So Happy</title>
		<link rel="stylesheet" href="../css/style.css">
	</head>
	<body data-page="accept">
		<main class="page-shell">
			<div class="centered">
				<p class="eyebrow">A beautiful beginning <span>08 / 09</span></p>
				<h1 class="page-title">I'm So Happy <em>So much.</em></h1>
				<form class="content-card form-card" data-response-form data-response="accept">
					<label for="reason">Your Reason</label>
					<textarea id="reason" name="reason" required placeholder="Tell me why you accepted my feelings..."></textarea>
					<p class="status" role="status"></p>
					<button class="button" type="submit">Send Answer <span aria-hidden="true">&#8594;</span></button>
				</form>
				<div class="content-card response-success is-hidden">
					<p>Thank you for accepting my feelings &#10084;</p>
					<p class="response-date" data-response-date></p>
				</div>
			</div>
		</main>
		<audio id="dating-audio" preload="auto" loop></audio>
		<script type="module" src="../js/script.js"></script>
	</body>
</html>
